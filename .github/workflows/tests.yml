name: tests

# The job names `linux` and `windows` are required by branch protection by name: never rename them.
# Pull request, push and manual (workflow_dispatch) runs leave the `slow` and `live` tests out; the nightly run (schedule) and a manual
# run started with `-f slow_and_live=true` run the full suite with them (#394 decision 8, #421 rule 7).
on:
  # `edited` too: a title or body edit reruns the closing check (the home repo's ticket #422), which reads the text as it stands then
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      slow_and_live:
        description: "run the tests marked slow and live too"
        type: boolean
        default: false

# A newer push to a pull request cancels its older run: only the newer head's result counts.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read  # check out the code
  actions: read  # the nightly live test reads this repo's tests runs and their jobs

env:
  MARKS_LEFT_OUT_OF_CHANGE_RUNS: "not slow and not live"
  NIGHTLY: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow_and_live) }}

jobs:
  linux:
    runs-on: ubuntu-latest
    # Per change: 4 minutes = ceil(2.6 minutes x 1.5), the first measured per-change job (2:36, pull request 213, one run).
    # Nightly (the `env.NIGHTLY` condition, written out here because `env` is not readable in a job-level timeout): 16 minutes,
    # unmeasured: set to 1.5 x the first nightly's job.
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow_and_live)) && 16 || 4 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      # Every workflow file of the repo is linted on every run, before pytest: a context a key may not read
      # (`runner` in a job's env, `steps` in a job's if) fails here, not as a run that never starts a job.
      # No file arguments: actionlint finds every workflow file itself. actionlint comes with the `test` extra.
      - name: lint the workflows
        run: actionlint
      # The commits a pull request adds hold no private data (#395 decision 4, row 7): the scan
      # reads the pull request's own commits, not the merge into main, and takes the author's and
      # the owner's public emails as allowed.
      - name: private data in the pull request's commits
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER: ${{ github.repository_owner }}
        run: |
          python -m orch_it guards scan --range "$BASE..$HEAD" --machine-independent --allow-email-of "$AUTHOR" --allow-email-of "$OWNER"
      # A closing word before a reference (`fixes <URL>`, `Resolves #N`) makes GitHub close the ticket on merge (the home repo's ticket #422):
      # the commits of the pull request, and its title and body, are read here, before the merge. The title and body
      # reach the command as environment variables only, never on the shell line.
      - name: closing words in the pull request's commits, title and body
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python -m orch_it merge closing-check --base "$BASE_REF" --head "$HEAD"
      - name: pytest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORCH_IT_REQUIRE_SSHD: "1"
          PYTHONPATH: ${{ github.workspace }}/src/orch_it/testruns/pytest_plugin  # where the `orch_it_ids` plugin is
          ORCH_IT_PLACEHOLDERS: ${{ vars.ORCH_IT_PLACEHOLDERS }}  # the stubs this repo writes for private data, paths joined by `os.pathsep`; empty: none
        run: |
          if [ "$NIGHTLY" = "true" ]; then kind=nightly; select=""; else kind=per_change; select="($MARKS_LEFT_OUT_OF_CHANGE_RUNS) and "; fi
          cores=$(python -c "import os; print(os.cpu_count())")
          bound=$(python -c 'import sys, tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["orch_it"]["tests"][sys.argv[1] + "_timeout_seconds"])' "$kind")
          echo "pytest: $cores cores (os.cpu_count() on this machine), $cores workers; each test is bound to $bound seconds ($kind run)"
          set +e
          pytest -q -p orch_it_ids -n "$cores" --dist worksteal --timeout "$bound" --junitxml=junit.xml -m "${select}not serial"
          parallel=$?
          pytest -q -p orch_it_ids --timeout "$bound" --junitxml=junit-serial.xml -m "${select}serial"
          serial=$?
          set -e
          if [ "$parallel" != 0 ] || [ "$serial" != 0 ]; then
            echo "pytest: a test over its bound of $bound seconds ($kind run) fails by name; on Windows pytest-timeout ends the worker, shown above as worker crashed while running <test>"
          fi
          python .github/scripts/merge_junit.py junit.xml junit.xml junit-serial.xml
          if [ "$serial" = 5 ]; then serial=0; fi
          exit $(( parallel != 0 ? parallel : serial ))
      # The account's rate limit as GitHub reports it at the end of the run (the importer reads this file name beside
      # junit.xml). Never fails the job: `continue-on-error`; a failed call leaves no empty file behind.
      - name: save the rate limit of the account
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api rate_limit > actions-rate-limit.json || rm -f actions-rate-limit.json
      - name: upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: |
            junit.xml
            actions-rate-limit.json
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    # Per change: 5 minutes = ceil(2.7 minutes x 1.5), the first measured per-change job (2:44, pull request 213, one run).
    # Nightly (the `env.NIGHTLY` condition, written out here because `env` is not readable in a job-level timeout): 16 minutes,
    # unmeasured: set to 1.5 x the first nightly's job.
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow_and_live)) && 16 || 5 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - name: pytest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/src/orch_it/testruns/pytest_plugin  # where the `orch_it_ids` plugin is
          ORCH_IT_PLACEHOLDERS: ${{ vars.ORCH_IT_PLACEHOLDERS }}  # the stubs this repo writes for private data, paths joined by `os.pathsep`; empty: none
        run: |
          # a change run takes only the tests marked as touching the OS (`os_touching`); the nightly run takes the whole Windows suite
          if [ "$NIGHTLY" = "true" ]; then kind=nightly; select=""; else kind=per_change; select="os_touching and ($MARKS_LEFT_OUT_OF_CHANGE_RUNS) and "; fi
          cores=$(python -c "import os; print(os.cpu_count())")
          bound=$(python -c 'import sys, tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["tool"]["orch_it"]["tests"][sys.argv[1] + "_timeout_seconds"])' "$kind")
          echo "pytest: $cores cores (os.cpu_count() on this machine), $cores workers; each test is bound to $bound seconds ($kind run)"
          set +e
          pytest -q -p orch_it_ids -n "$cores" --dist worksteal --timeout "$bound" --junitxml=junit.xml -m "${select}not serial"
          parallel=$?
          pytest -q -p orch_it_ids --timeout "$bound" --junitxml=junit-serial.xml -m "${select}serial"
          serial=$?
          set -e
          if [ "$parallel" != 0 ] || [ "$serial" != 0 ]; then
            echo "pytest: a test over its bound of $bound seconds ($kind run) fails by name; on Windows pytest-timeout ends the worker, shown above as worker crashed while running <test>"
          fi
          python .github/scripts/merge_junit.py junit.xml junit.xml junit-serial.xml
          if [ "$serial" = 5 ]; then serial=0; fi
          exit $(( parallel != 0 ? parallel : serial ))
      # The account's rate limit as GitHub reports it at the end of the run (the importer reads this file name beside
      # junit.xml). Never fails the job: `continue-on-error`; a failed call removes the file it made, PowerShell's way.
      - name: save the rate limit of the account
        if: always()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api rate_limit > actions-rate-limit.json
          if ($LASTEXITCODE -ne 0) { Remove-Item -Force -ErrorAction SilentlyContinue actions-rate-limit.json }
      - name: upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: |
            junit.xml
            actions-rate-limit.json
          if-no-files-found: ignore

  # The foreign run: the suite and the layer's setup commands in a copy that is not the owner's setup (another folder
  # name, an invented origin, no git identity, no GitHub variable; on Linux and macOS a PATH with no bare `python`). It
  # selects the tests the way the pytest job of the same OS does: a change run takes `MARKS_LEFT_OUT_OF_CHANGE_RUNS` (not
  # slow, not live), and on Windows only the `os_touching` tests among them; the nightly run everything but the live
  # tests (the script's NIGHTLY_SELECTION). The tests that skip or are left out here are the ones that need gh or
  # GitHub's network: the live ones, which both selections leave out, since the foreign setup holds no token.
  # Each job's bound is on its own `timeout-minutes` line, with the minutes it was measured in written beside it.
  foreign-linux:
    runs-on: ubuntu-latest
    # Per change: 9 minutes = ceil(5.95 minutes x 1.5), the first measured per-change job (5:57, pull request 213, one run).
    # Nightly (the `env.NIGHTLY` condition, written out here because `env` is not readable in a job-level timeout): 11 minutes,
    # unmeasured: set to 1.5 x the first nightly's job.
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow_and_live)) && 11 || 9 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the foreign run
        shell: bash
        env:
          ORCH_IT_REQUIRE_SSHD: "1"  # the same switch the linux pytest step sets: the real sshd test must run here too
        run: python3 .github/scripts/foreign_run.py
      - name: upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: ignore

  foreign-windows:
    runs-on: windows-latest
    # Per change: 12 minutes = ceil(7.6 minutes x 1.5), the first measured per-change job (7:36, pull request 213, one run).
    # Nightly (the `env.NIGHTLY` condition, written out here because `env` is not readable in a job-level timeout): 40 minutes,
    # unmeasured: set to 1.5 x the first nightly's job.
    timeout-minutes: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.slow_and_live)) && 40 || 12 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the foreign run  # no ORCH_IT_REQUIRE_SSHD here: the windows pytest step does not set it either
        shell: bash
        run: python .github/scripts/foreign_run.py
      - name: upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: ignore

  # The nightly schedule only: macOS is no machine of the owner's, so its foreign run is read on the nightly. Its PATH
  # takes the same bin rule as Linux's (no bare `python`); on the nightly the script runs the slow tests too, as the
  # nightly windows job does, and leaves out the live ones (no token in the foreign setup).
  foreign-macos:
    if: github.event_name == 'schedule'
    runs-on: macos-latest
    timeout-minutes: 30  # unmeasured: set to 1.5 x the first nightly's job
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the foreign run
        shell: bash
        run: python3 .github/scripts/foreign_run.py
      - name: upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}-${{ github.run_attempt }}
          path: junit.xml
          if-no-files-found: ignore
