# The exceptions list (#413, CODING_STANDARDS.md): each [[exception]] is a file (a glob, a repo path, or a list of
# them), a pattern (a regex over one line), the kinds of finding it excuses and the reason the line may stand. One
# entry per cause. An entry excuses only the kinds it names, on the lines its pattern matches; another kind on the same
# line, or the same kind on a line the pattern does not match, is still a finding. An entry with no kinds or no reason
# refuses the push. The reasons marked "follow-up" are values that are real and wait for the ticket named in the entry.
# A pattern that quotes the word it excuses writes one letter in brackets (`[u]ser`, `py[t]hon`, `[U]SER`): the bracket
# escape stops the entry from matching its own line.

# ---- 6. A word that is also a workflow job name, used as a plain word ----------------------------------------

[[exception]]
file = ["src/orch_it/cli.py", "src/orch_it/guards/install.py", "src/orch_it/merge/commands.py", "src/orch_it/merge/follow.py", "src/orch_it/merge/marks.py", "src/orch_it/tickets/hook.py", "src/orch_it/tickets/model.py", "src/orch_it/tickets/queues.py"]
pattern = '''["'`](check|follow|sweep|shape|update)["'`]'''
kinds = ["check_name_literal"]
reason = "The workflow files give the jobs short names that are also ordinary words; here the quoted word is a command name, an event step, a queue name, a table header, a dictionary key or a flag value, not the name of a GitHub check."

[[exception]]
file = ["tests/merge_trial.py", "tests/merge_trial_live_r4.py", "tests/test_cli_brain.py", "tests/test_cli_merge.py", "tests/test_closed_sets.py", "tests/test_follow_workflow.py", "tests/test_guards_install.py", "tests/test_guards_status.py", "tests/test_merge_follow_mark_only.py", "tests/test_merge_line.py", "tests/test_merge_reconcile.py", "tests/test_merge_trial.py", "tests/test_merge_trial_live_r4.py", "tests/test_merge_trial_live_r5.py", "tests/test_required_checks.py", "tests/test_skill_copies.py", "tests/test_skill_shadow.py", "tests/test_ticket_queues.py", "tests/test_tickets_hook.py"]
pattern = '''["'`](check|follow|sweep|shape|update)["'`]'''
kinds = ["check_name_literal"]
